[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquefaction"
version = "0.1.0"
description = "SPT/CPT liquefaction potential analysis"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "reportlab>=4.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
liquefaction-cli = "liquefaction.cli:main"
liquefaction-ui = "liquefaction.ui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
